<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#00aeef">
    <link
      rel="icon"
      type="image/png"
      sizes="46x32"
      href="{{ url_for('static', path=brand_assets.favicon) }}"
    >
    <link
      rel="icon"
      type="image/png"
      sizes="23x16"
      href="{{ url_for('static', path=brand_assets.favicon_small) }}"
    >
    <title>{% block title %}Спортивный клуб ТюмГУ{% endblock %}</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    >
    <link href="{{ url_for('static', path='css/app.css') }}" rel="stylesheet">
  </head>
  <body style="--brand-background-image: url('{{ url_for('static', path=brand_assets.background_logo) }}')">
    <header class="site-header">
      <nav class="navbar navbar-expand-md" aria-label="Основная навигация">
        <div class="container">
          <a class="navbar-brand d-flex align-items-center gap-2" href="{{ url_for('home') }}">
            <img
              class="navbar-brand-logo"
              src="{{ url_for('static', path=brand_assets.header_logo) }}"
              alt="Логотип ССК «Ладья»"
              width="69"
              height="48"
            >
            <span><strong>Ладья</strong><small>Спортивный клуб ТюмГУ</small></span>
          </a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#main-navigation"
            aria-controls="main-navigation"
            aria-expanded="false"
            aria-label="Открыть меню"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="main-navigation">
            <ul class="navbar-nav ms-auto align-items-md-center gap-md-2">
              <li class="nav-item"><a class="nav-link" href="{{ url_for('schedule') }}">Расписание</a></li>
              <li class="nav-item"><a class="nav-link" href="{{ url_for('competitions') }}">Соревнования</a></li>
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <main>{% block content %}{% endblock %}</main>

    <footer class="site-footer">
      <div class="container d-flex flex-column flex-sm-row justify-content-between gap-2">
        <span>Спортивный клуб ТюмГУ «Ладья»</span>
        <span>Тюмень</span>
      </div>
    </footer>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
