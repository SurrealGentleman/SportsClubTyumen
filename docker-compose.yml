services:
  app:
    build:
      context: .
    environment:
      APP_NAME: ${APP_NAME:-Спортивный клуб ТюмГУ}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      APP_DEBUG: ${APP_DEBUG:-false}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sportclub}:${POSTGRES_PASSWORD:-change_me}@postgres:5432/${POSTGRES_DB:-sportclub}
      DATABASE_ECHO: ${DATABASE_ECHO:-false}
      SECRET_KEY: ${SECRET_KEY:-change_me}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      ADMIN_LOGIN_ACCOUNT_LIMIT: ${ADMIN_LOGIN_ACCOUNT_LIMIT:-5}
      ADMIN_LOGIN_IP_LIMIT: ${ADMIN_LOGIN_IP_LIMIT:-30}
      ADMIN_LOGIN_WINDOW_SECONDS: ${ADMIN_LOGIN_WINDOW_SECONDS:-900}
      UNIVERSITY_EMAIL_DOMAIN: ${UNIVERSITY_EMAIL_DOMAIN:-utmn.ru}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Yekaterinburg}
      CAPTCHA_ENABLED: ${CAPTCHA_ENABLED:-true}
      SMARTCAPTCHA_CLIENT_KEY: ${SMARTCAPTCHA_CLIENT_KEY:-}
      SMARTCAPTCHA_SERVER_KEY: ${SMARTCAPTCHA_SERVER_KEY:-}
      SMARTCAPTCHA_ALLOWED_HOSTS: ${SMARTCAPTCHA_ALLOWED_HOSTS:-localhost:8000,127.0.0.1:8000}
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sportclub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-sportclub}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
