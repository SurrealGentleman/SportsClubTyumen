name: sportsclub-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    image: sportsclub:production
    build:
      context: .
    restart: unless-stopped
    init: true
    env_file: .env
    command: ["sh", "-c", "python -m scripts.check_deployment && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*' --no-access-log"]
    networks: [ingress, database]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import http.client, os; from urllib.parse import urlsplit; c = http.client.HTTPConnection('127.0.0.1', 8000, timeout=3); c.request('GET', '/api/v1/health', headers={'Host': urlsplit(os.environ['PUBLIC_BASE_URL']).netloc, 'X-Forwarded-Proto': 'https'}); raise SystemExit(0 if c.getresponse().status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid
    logging: *logging

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [database]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *logging

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [ingress]
    depends_on:
      app:
        condition: service_healthy
    logging: *logging

networks:
  ingress:
  database:
    internal: true

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
